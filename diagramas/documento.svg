<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 644" role="img" aria-labelledby="documento-title documento-desc">
<title id="documento-title">Del archivo a la revisión</title><desc id="documento-desc">Un documento entra por archivo o editor, pasa por borrador y se publica; luego el equipo comenta, da OK y asigna tareas.</desc>
<style>
.paper{fill:#f5f5f5}.title{font:400 26px Georgia,'Times New Roman',serif;fill:#2d3142}
.eyebrow{font:500 10px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em;fill:#5a6580}
.name{font:600 14px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#2d3142}
.sub{font:400 11px ui-monospace,Menlo,Consolas,monospace;fill:#4f5d75}
.lbl{font:500 10px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em;fill:#4f5d75}
.note{font:italic 400 14px Georgia,'Times New Roman',serif;fill:#4f5d75}
.mask{fill:#f5f5f5}
.n-ext{fill:rgba(45,49,66,.03);stroke:rgba(45,49,66,.45);stroke-width:1}
.n-back{fill:#fff;stroke:#2d3142;stroke-width:1}
.n-store{fill:rgba(45,49,66,.06);stroke:#4f5d75;stroke-width:1}
.n-focal{fill:rgba(191,69,32,.08);stroke:#bf4520;stroke-width:1.2}
.n-scope{fill:none;stroke:#5a6580;stroke-width:1;stroke-dasharray:4 3}
.e{fill:none;stroke:#4f5d75;stroke-width:1}.e-link{fill:none;stroke:#2e5aa8;stroke-width:1}
.e-acc{fill:none;stroke:#bf4520;stroke-width:1.2}.dash{stroke-dasharray:5 4}
.life{stroke:#bfc0c0;stroke-width:1;stroke-dasharray:3 4}.rule{stroke:rgba(45,49,66,.15);stroke-width:1}
.mk{fill:#4f5d75}.mk-link{fill:#2e5aa8}.mk-acc{fill:#bf4520}
@media (prefers-color-scheme:dark){
.paper{fill:#2d3142}.title,.name{fill:#f5f5f5}.eyebrow,.sub,.lbl,.note{fill:#bfc0c0}.mask{fill:#2d3142}
.n-ext{fill:rgba(245,245,245,.04);stroke:rgba(245,245,245,.4)}.n-back{fill:#393e53;stroke:#f5f5f5}
.n-store{fill:rgba(245,245,245,.07);stroke:#bfc0c0}.n-focal{fill:rgba(240,138,89,.12);stroke:#f08a59}
.n-scope{stroke:#949eb2}.e{stroke:#bfc0c0}.e-link{stroke:#739fdf}.e-acc{stroke:#f08a59}
.life{stroke:rgba(191,192,192,.3)}.rule{stroke:rgba(245,245,245,.15)}
.mk{fill:#bfc0c0}.mk-link{fill:#739fdf}.mk-acc{fill:#f08a59}}
</style><defs><marker id="documento-mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="mk" d="M0 1L10 5L0 9z"/></marker><marker id="documento-mk-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="mk-link" d="M0 1L10 5L0 9z"/></marker><marker id="documento-mk-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="mk-acc" d="M0 1L10 5L0 9z"/></marker></defs>
<rect class="paper" width="960" height="644"/>
<text class="eyebrow" x="40" y="30">COLABORADOCS · DOCUMENTOS</text><text class="title" x="40" y="62">Del archivo a la revisión</text>
<g transform="translate(0,24)"><path class="e" d="M220 108 L280 108" marker-end="url(#documento-mk)"/><path class="e" d="M460 108 L520 108" marker-end="url(#documento-mk)"/><path class="e" d="M220 204 L520 204" marker-end="url(#documento-mk)"/><path class="e" d="M700 108 L760 108" marker-end="url(#documento-mk)"/><path class="e-acc" d="M840 144 L840 300" marker-end="url(#documento-mk-acc)"/><path class="e dash" d="M840 388 L840 452" marker-end="url(#documento-mk)"/><path class="e" d="M760 344 L700 344" marker-end="url(#documento-mk)"/><path class="e" d="M520 344 L460 344" marker-end="url(#documento-mk)"/><rect class="mask" x="332" y="187" width="76" height="16"/><text class="lbl" x="370" y="198" text-anchor="middle">AUTOGUARDA</text><rect class="mask" x="705" y="87" width="50" height="16"/><text class="lbl" x="730" y="98" text-anchor="middle">VALIDA</text><rect class="mask" x="846" y="215" width="96" height="16"/><text class="lbl" x="851" y="226" text-anchor="start">NUEVA VERSIÓN</text><rect class="mask" x="846" y="413" width="69" height="16"/><text class="lbl" x="851" y="424" text-anchor="start">REEMPLAZA</text><rect class="n-ext" x="40" y="72" width="180" height="72" rx="6"/><text class="name" x="54" y="106">Archivo</text><text class="sub" x="54" y="124">Word, Markdown o JSON</text><rect class="n-ext" x="40" y="168" width="180" height="72" rx="6"/><text class="name" x="54" y="202">Editor web</text><text class="sub" x="54" y="220">/d/&lt;id&gt;/editar</text><rect class="n-back" x="280" y="72" width="180" height="72" rx="6"/><text class="name" x="294" y="99">doc-import</text><text class="sub" x="294" y="117">convierte y avisa de</text><text class="sub" x="294" y="131">lo que no se conservó</text><rect class="n-back" x="520" y="72" width="180" height="168" rx="6"/><text class="name" x="534" y="133">Borrador</text><text class="sub" x="534" y="151">uno por documento,</text><text class="sub" x="534" y="165">compartido por admins</text><text class="sub" x="534" y="179">con revisión: nadie</text><text class="sub" x="534" y="193">pisa a otro</text><rect class="n-focal" x="760" y="72" width="160" height="72" rx="6"/><text class="name" x="774" y="106">Publicar</text><text class="sub" x="774" y="124">solo admins</text><rect class="n-store" x="760" y="300" width="160" height="88" rx="6"/><text class="name" x="774" y="335">Vigente</text><text class="sub" x="774" y="353">/d/&lt;id&gt; en D1</text><text class="sub" x="774" y="367">texto tras el PIN</text><rect class="n-store" x="760" y="452" width="160" height="72" rx="6"/><text class="name" x="774" y="479">Versiones</text><text class="sub" x="774" y="497">quién y cuándo</text><text class="sub" x="774" y="511">la reemplazó</text><rect class="n-focal" x="520" y="300" width="180" height="88" rx="6"/><text class="name" x="534" y="335">Revisión</text><text class="sub" x="534" y="353">comentarios e hilos</text><text class="sub" x="534" y="367">OK por bloque</text><rect class="n-back" x="280" y="300" width="180" height="88" rx="6"/><text class="name" x="294" y="335">Tareas</text><text class="sub" x="294" y="353">una persona, una fecha</text><text class="sub" x="294" y="367">puede colgar de bloque</text><text class="note" x="40" y="452">El id de un bloque es sección + hash de su texto: si editas un párrafo,</text><text class="note" x="40" y="474">sus comentarios y OK dejan de aplicar. Es a propósito.</text>
<line class="rule" x1="40" x2="920" y1="568" y2="568"/><rect class="n-ext" x="40" y="584" width="20" height="12" rx="3"/><text class="lbl" x="68" y="594">EXTERNO / CLIENTE</text><rect class="n-back" x="208.2" y="584" width="20" height="12" rx="3"/><text class="lbl" x="236.2" y="594">COMPONENTE</text><rect class="n-focal" x="330.2" y="584" width="20" height="12" rx="3"/><text class="lbl" x="358.2" y="594">FOCO</text><rect class="n-store" x="412.6" y="584" width="20" height="12" rx="3"/><text class="lbl" x="440.6" y="594">ALMACÉN (D1)</text></g>
</svg>