<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 644" role="img" aria-labelledby="datos-title datos-desc">
<title id="datos-title">Qué guarda D1</title><desc id="datos-desc">Siete grupos de tablas: accesos, documentos, revisión, tareas, presentaciones, temas y ajustes del espacio.</desc>
<style>
