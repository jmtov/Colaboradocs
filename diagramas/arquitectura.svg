<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 624" role="img" aria-labelledby="arquitectura-title arquitectura-desc">
<title id="arquitectura-title">Un Worker, una base, una página</title><desc id="arquitectura-desc">La página y la API viven en un solo Cloudflare Worker con D1; el CLI escribe en la misma base.</desc>
<style>
.paper{fill:#f5f5f5}.title{font:400 26px Georgia,'Times New Roman',serif;fill:#2d3142}
.eyebrow{font:500 10px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em;fill:#5a6580}
.name{font:600 14px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#2d3142}
.sub{font:400 11px ui-monospace,Menlo,Consolas,monospace;fill:#4f5d75}
.lbl{font:500 10px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em;fill:#4f5d75}
.note{font:italic 400 14px Georgia,'Times New Roman',serif;fill:#4f5d75}
.mask{fill:#f5f5f5}
.n-ext{fill:rgba(45,49,66,.03);stroke:rgba(45,49,66,.45);stroke-width:1}
.n-back{fill:#fff;stroke:#2d3142;stroke-width:1}
.n-store{fill:rgba(45,49,66,.06);stroke:#4f5d75;stroke-width:1}
.n-focal{fill:rgba(191,69,32,.08);stroke:#bf4520;stroke-width:1.2}
.n-scope{fill:none;stroke:#5a6580;stroke-width:1;stroke-dasharray:4 3}
.e{fill:none;stroke:#4f5d75;stroke-width:1}.e-link{fill:none;stroke:#2e5aa8;stroke-width:1}
.e-acc{fill:none;stroke:#bf4520;stroke-width:1.2}.dash{stroke-dasharray:5 4}
.life{stroke:#bfc0c0;stroke-width:1;stroke-dasharray:3 4}.rule{stroke:rgba(45,49,66,.15);stroke-width:1}
.mk{fill:#4f5d75}.mk-link{fill:#2e5aa8}.mk-acc{fill:#bf4520}
@media (prefers-color-scheme:dark){
.paper{fill:#2d3142}.title,.name{fill:#f5f5f5}.eyebrow,.sub,.lbl,.note{fill:#bfc0c0}.mask{fill:#2d3142}
.n-ext{fill:rgba(245,245,245,.04);stroke:rgba(245,245,245,.4)}.n-back{fill:#393e53;stroke:#f5f5f5}
.n-store{fill:rgba(245,245,245,.07);stroke:#bfc0c0}.n-focal{fill:rgba(240,138,89,.12);stroke:#f08a59}
.n-scope{stroke:#949eb2}.e{stroke:#bfc0c0}.e-link{stroke:#739fdf}.e-acc{stroke:#f08a59}
.life{stroke:rgba(191,192,192,.3)}.rule{stroke:rgba(245,245,245,.15)}
.mk{fill:#bfc0c0}.mk-link{fill:#739fdf}.mk-acc{fill:#f08a59}}
</style><defs><marker id="arquitectura-mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="mk" d="M0 1L10 5L0 9z"/></marker><marker id="arquitectura-mk-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="mk-link" d="M0 1L10 5L0 9z"/></marker><marker id="arquitectura-mk-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="mk-acc" d="M0 1L10 5L0 9z"/></marker></defs>
<rect class="paper" width="960" height="624"/>
<text class="eyebrow" x="40" y="30">COLABORADOCS · ARQUITECTURA</text><text class="title" x="40" y="62">Un Worker, una base, una página</text>
<g transform="translate(0,24)"><rect class="n-scope" x="280" y="112" width="440" height="268" rx="8"/><text class="eyebrow" x="296" y="132">UN SOLO WORKER · UN SOLO DEPLOY</text><path class="e" d="M130 236 L130 196 Q130 188 138 188 L312 188" marker-end="url(#arquitectura-mk)"/><path class="e" d="M220 284 L312 284" marker-end="url(#arquitectura-mk)"/><path class="e" d="M480 292 L520 292" marker-end="url(#arquitectura-mk)"/><path class="e" d="M688 292 L776 292" marker-end="url(#arquitectura-mk)"/><path class="e dash" d="M220 460 L840 460 Q848 460 848 452 L848 336" marker-end="url(#arquitectura-mk)"/><rect class="mask" x="200" y="171" width="43" height="16"/><text class="lbl" x="221" y="182" text-anchor="middle">GET /</text><rect class="mask" x="244" y="263" width="43" height="16"/><text class="lbl" x="266" y="274" text-anchor="middle">TOKEN</text><rect class="mask" x="733" y="271" width="30" height="16"/><text class="lbl" x="748" y="282" text-anchor="middle">SQL</text><rect class="mask" x="493" y="443" width="83" height="16"/><text class="lbl" x="534" y="454" text-anchor="middle">WRANGLER D1</text><rect class="n-ext" x="40" y="236" width="180" height="88" rx="6"/><text class="name" x="54" y="271">Navegador</text><text class="sub" x="54" y="289">SPA Solid (apps/web)</text><text class="sub" x="54" y="303">token en localStorage</text><rect class="n-back" x="312" y="160" width="376" height="56" rx="6"/><text class="name" x="326" y="186">Assets estáticos</text><text class="sub" x="326" y="204">apps/web/dist: la página, sin datos</text><rect class="n-back" x="312" y="248" width="168" height="88" rx="6"/><text class="name" x="326" y="283">Auth</text><text class="sub" x="326" y="301">Bearer firmado</text><text class="sub" x="326" y="315">y D1 en cada petición</text><rect class="n-focal" x="520" y="248" width="168" height="88" rx="6"/><text class="name" x="534" y="276">API · Hono</text><text class="sub" x="534" y="294">/api/*  login</text><text class="sub" x="534" y="308">documentos · admin</text><text class="sub" x="534" y="322">decks · tareas</text><rect class="n-store" x="776" y="248" width="144" height="88" rx="6"/><text class="name" x="790" y="283">D1</text><text class="sub" x="790" y="301">todo el estado:</text><text class="sub" x="790" y="315">docs, decks, PIN</text><rect class="n-ext" x="40" y="424" width="180" height="72" rx="6"/><text class="name" x="54" y="451">CLI</text><text class="sub" x="54" y="469">pins · documents</text><text class="sub" x="54" y="483">decks · setup</text><text class="note" x="40" y="524">La página no trae documentos: los pide a la API después del PIN.</text>
<line class="rule" x1="40" x2="920" y1="548" y2="548"/><rect class="n-scope" x="40" y="564" width="20" height="12" rx="3"/><text class="lbl" x="68" y="574">ÁMBITO</text><rect class="n-ext" x="135.6" y="564" width="20" height="12" rx="3"/><text class="lbl" x="163.6" y="574">EXTERNO / CLIENTE</text><rect class="n-back" x="303.79999999999995" y="564" width="20" height="12" rx="3"/><text class="lbl" x="331.79999999999995" y="574">COMPONENTE</text><rect class="n-focal" x="425.79999999999995" y="564" width="20" height="12" rx="3"/><text class="lbl" x="453.79999999999995" y="574">FOCO</text><rect class="n-store" x="508.19999999999993" y="564" width="20" height="12" rx="3"/><text class="lbl" x="536.1999999999999" y="574">ALMACÉN (D1)</text></g>
</svg>