<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 664" role="img" aria-labelledby="acceso-title acceso-desc">
<title id="acceso-title">Del PIN al token</title><desc id="acceso-desc">Un admin crea el PIN; la persona lo canjea por un token de 30 días y cada petición se verifica en D1.</desc>
<style>
.paper{fill:#f5f5f5}.title{font:400 26px Georgia,'Times New Roman',serif;fill:#2d3142}
.eyebrow{font:500 10px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em;fill:#5a6580}
.name{font:600 14px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#2d3142}
.sub{font:400 11px ui-monospace,Menlo,Consolas,monospace;fill:#4f5d75}
.lbl{font:500 10px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em;fill:#4f5d75}
.note{font:italic 400 14px Georgia,'Times New Roman',serif;fill:#4f5d75}
.mask{fill:#f5f5f5}
.n-ext{fill:rgba(45,49,66,.03);stroke:rgba(45,49,66,.45);stroke-width:1}
.n-back{fill:#fff;stroke:#2d3142;stroke-width:1}
.n-store{fill:rgba(45,49,66,.06);stroke:#4f5d75;stroke-width:1}
.n-focal{fill:rgba(191,69,32,.08);stroke:#bf4520;stroke-width:1.2}
.n-scope{fill:none;stroke:#5a6580;stroke-width:1;stroke-dasharray:4 3}
.e{fill:none;stroke:#4f5d75;stroke-width:1}.e-link{fill:none;stroke:#2e5aa8;stroke-width:1}
.e-acc{fill:none;stroke:#bf4520;stroke-width:1.2}.dash{stroke-dasharray:5 4}
.life{stroke:#bfc0c0;stroke-width:1;stroke-dasharray:3 4}.rule{stroke:rgba(45,49,66,.15);stroke-width:1}
.mk{fill:#4f5d75}.mk-link{fill:#2e5aa8}.mk-acc{fill:#bf4520}
@media (prefers-color-scheme:dark){
.paper{fill:#2d3142}.title,.name{fill:#f5f5f5}.eyebrow,.sub,.lbl,.note{fill:#bfc0c0}.mask{fill:#2d3142}
.n-ext{fill:rgba(245,245,245,.04);stroke:rgba(245,245,245,.4)}.n-back{fill:#393e53;stroke:#f5f5f5}
.n-store{fill:rgba(245,245,245,.07);stroke:#bfc0c0}.n-focal{fill:rgba(240,138,89,.12);stroke:#f08a59}
.n-scope{stroke:#949eb2}.e{stroke:#bfc0c0}.e-link{stroke:#739fdf}.e-acc{stroke:#f08a59}
.life{stroke:rgba(191,192,192,.3)}.rule{stroke:rgba(245,245,245,.15)}
.mk{fill:#bfc0c0}.mk-link{fill:#739fdf}.mk-acc{fill:#f08a59}}
</style><defs><marker id="acceso-mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="mk" d="M0 1L10 5L0 9z"/></marker><marker id="acceso-mk-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="mk-link" d="M0 1L10 5L0 9z"/></marker><marker id="acceso-mk-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="mk-acc" d="M0 1L10 5L0 9z"/></marker></defs>
<rect class="paper" width="960" height="664"/>
<text class="eyebrow" x="40" y="30">COLABORADOCS · ACCESO</text><text class="title" x="40" y="62">Del PIN al token</text>
<g transform="translate(0,24)"><line class="life" x1="240" x2="240" y1="136" y2="540"/><line class="life" x1="440" x2="440" y1="136" y2="540"/><line class="life" x1="660" x2="660" y1="136" y2="540"/><line class="life" x1="860" x2="860" y1="136" y2="540"/><path class="e" d="M240 176 L660 176" marker-end="url(#acceso-mk)"/><path class="e" d="M660 216 L860 216" marker-end="url(#acceso-mk)"/><path class="e dash" d="M660 264 L240 264" marker-end="url(#acceso-mk)"/><path class="e" d="M440 336 L660 336" marker-end="url(#acceso-mk)"/><path class="e" d="M660 376 L860 376" marker-end="url(#acceso-mk)"/><path class="e dash" d="M660 416 L440 416" marker-end="url(#acceso-mk)"/><path class="e-link" d="M440 476 L660 476" marker-end="url(#acceso-mk-link)"/><path class="e" d="M660 516 L860 516" marker-end="url(#acceso-mk)"/><rect class="mask" x="405" y="157" width="89" height="16"/><text class="lbl" x="450" y="168" text-anchor="middle">CREA PERSONA</text><rect class="mask" x="719" y="197" width="83" height="16"/><text class="lbl" x="760" y="208" text-anchor="middle">GUARDA HMAC</text><rect class="mask" x="402" y="245" width="96" height="16"/><text class="lbl" x="450" y="256" text-anchor="middle">PIN (UNA VEZ)</text><rect class="mask" x="505" y="317" width="89" height="16"/><text class="lbl" x="550" y="328" text-anchor="middle">PIN + DEVICE</text><rect class="mask" x="702" y="357" width="116" height="16"/><text class="lbl" x="760" y="368" text-anchor="middle">HASH · CUPO · IP</text><rect class="mask" x="502" y="397" width="96" height="16"/><text class="lbl" x="550" y="408" text-anchor="middle">TOKEN 30 DÍAS</text><rect class="mask" x="505" y="457" width="89" height="16"/><text class="lbl" x="550" y="468" text-anchor="middle">BEARER TOKEN</text><rect class="mask" x="709" y="497" width="102" height="16"/><text class="lbl" x="760" y="508" text-anchor="middle">¿SIGUE ACTIVO?</text><rect class="n-ext" x="170" y="80" width="140" height="56" rx="6"/><text class="name" x="184" y="106">Admin</text><text class="sub" x="184" y="124">CLI o web</text><rect class="n-ext" x="370" y="80" width="140" height="56" rx="6"/><text class="name" x="384" y="106">Persona</text><text class="sub" x="384" y="124">celular</text><rect class="n-focal" x="590" y="80" width="140" height="56" rx="6"/><text class="name" x="604" y="106">Worker</text><text class="sub" x="604" y="124">API</text><rect class="n-store" x="790" y="80" width="140" height="56" rx="6"/><text class="name" x="804" y="113">D1</text><text class="eyebrow" x="40" y="180">ALTA</text><text class="eyebrow" x="40" y="340">LOGIN</text><text class="eyebrow" x="40" y="480">CADA PETICIÓN</text><line class="rule" x1="40" x2="920" y1="296" y2="296"/><line class="rule" x1="40" x2="920" y1="436" y2="436"/><text class="note" x="40" y="574">Máx. 2 dispositivos por PIN y 10 fallos por IP cada 15 min. Barrera suave, no seguridad real.</text>
<line class="rule" x1="40" x2="920" y1="588" y2="588"/><rect class="n-ext" x="40" y="604" width="20" height="12" rx="3"/><text class="lbl" x="68" y="614">EXTERNO / CLIENTE</text><rect class="n-focal" x="208.2" y="604" width="20" height="12" rx="3"/><text class="lbl" x="236.2" y="614">FOCO</text><rect class="n-store" x="290.6" y="604" width="20" height="12" rx="3"/><text class="lbl" x="318.6" y="614">ALMACÉN (D1)</text></g>
</svg>