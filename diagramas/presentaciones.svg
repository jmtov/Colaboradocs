<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 664" role="img" aria-labelledby="presentaciones-title presentaciones-desc">
<title id="presentaciones-title">Una presentación son datos</title><desc id="presentaciones-desc">Un deck JSON y un tema JSON se validan y se dibujan en un HTML autocontenido; el editor trabaja sobre un borrador.</desc>
<style>
.paper{fill:#f5f5f5}.title{font:400 26px Georgia,'Times New Roman',serif;fill:#2d3142}
.eyebrow{font:500 10px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em;fill:#5a6580}
.name{font:600 14px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#2d3142}
.sub{font:400 11px ui-monospace,Menlo,Consolas,monospace;fill:#4f5d75}
.lbl{font:500 10px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em;fill:#4f5d75}
.note{font:italic 400 14px Georgia,'Times New Roman',serif;fill:#4f5d75}
.mask{fill:#f5f5f5}
.n-ext{fill:rgba(45,49,66,.03);stroke:rgba(45,49,66,.45);stroke-width:1}
.n-back{fill:#fff;stroke:#2d3142;stroke-width:1}
.n-store{fill:rgba(45,49,66,.06);stroke:#4f5d75;stroke-width:1}
.n-focal{fill:rgba(191,69,32,.08);stroke:#bf4520;stroke-width:1.2}
.n-scope{fill:none;stroke:#5a6580;stroke-width:1;stroke-dasharray:4 3}
.e{fill:none;stroke:#4f5d75;stroke-width:1}.e-link{fill:none;stroke:#2e5aa8;stroke-width:1}
.e-acc{fill:none;stroke:#bf4520;stroke-width:1.2}.dash{stroke-dasharray:5 4}
.life{stroke:#bfc0c0;stroke-width:1;stroke-dasharray:3 4}.rule{stroke:rgba(45,49,66,.15);stroke-width:1}
.mk{fill:#4f5d75}.mk-link{fill:#2e5aa8}.mk-acc{fill:#bf4520}
@media (prefers-color-scheme:dark){
.paper{fill:#2d3142}.title,.name{fill:#f5f5f5}.eyebrow,.sub,.lbl,.note{fill:#bfc0c0}.mask{fill:#2d3142}
.n-ext{fill:rgba(245,245,245,.04);stroke:rgba(245,245,245,.4)}.n-back{fill:#393e53;stroke:#f5f5f5}
.n-store{fill:rgba(245,245,245,.07);stroke:#bfc0c0}.n-focal{fill:rgba(240,138,89,.12);stroke:#f08a59}
.n-scope{stroke:#949eb2}.e{stroke:#bfc0c0}.e-link{stroke:#739fdf}.e-acc{stroke:#f08a59}
.life{stroke:rgba(191,192,192,.3)}.rule{stroke:rgba(245,245,245,.15)}
.mk{fill:#bfc0c0}.mk-link{fill:#739fdf}.mk-acc{fill:#f08a59}}
</style><defs><marker id="presentaciones-mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="mk" d="M0 1L10 5L0 9z"/></marker><marker id="presentaciones-mk-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="mk-link" d="M0 1L10 5L0 9z"/></marker><marker id="presentaciones-mk-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="mk-acc" d="M0 1L10 5L0 9z"/></marker></defs>
<rect class="paper" width="960" height="664"/>
<text class="eyebrow" x="40" y="30">COLABORADOCS · PRESENTACIONES</text><text class="title" x="40" y="62">Una presentación son datos</text>
<g transform="translate(0,24)"><path class="e" d="M220 108 L280 108" marker-end="url(#presentaciones-mk)"/><path class="e" d="M460 108 L520 108" marker-end="url(#presentaciones-mk)"/><path class="e dash" d="M700 108 L760 108" marker-end="url(#presentaciones-mk)"/><path class="e-acc" d="M610 144 L610 272" marker-end="url(#presentaciones-mk-acc)"/><path class="e" d="M460 308 L520 308" marker-end="url(#presentaciones-mk)"/><path class="e" d="M700 308 L760 308" marker-end="url(#presentaciones-mk)"/><path class="e dash" d="M610 380 L610 440" marker-end="url(#presentaciones-mk)"/><rect class="mask" x="225" y="87" width="50" height="16"/><text class="lbl" x="250" y="98" text-anchor="middle">GUARDA</text><rect class="mask" x="462" y="87" width="56" height="16"/><text class="lbl" x="490" y="98" text-anchor="middle">PUBLICA</text><rect class="mask" x="699" y="87" width="63" height="16"/><text class="lbl" x="730" y="98" text-anchor="middle">COMENTAN</text><rect class="mask" x="616" y="203" width="43" height="16"/><text class="lbl" x="621" y="214" text-anchor="start">DATOS</text><rect class="mask" x="616" y="405" width="96" height="16"/><text class="lbl" x="621" y="416" text-anchor="start">RUTA RELATIVA</text><rect class="n-ext" x="40" y="72" width="180" height="72" rx="6"/><text class="name" x="54" y="99">Editor web</text><text class="sub" x="54" y="117">/p/&lt;id&gt;/editar</text><text class="sub" x="54" y="131">vista previa en vivo</text><rect class="n-back" x="280" y="72" width="180" height="72" rx="6"/><text class="name" x="294" y="99">Borrador</text><text class="sub" x="294" y="117">borrador a medias;</text><text class="sub" x="294" y="131">se valida al publicar</text><rect class="n-store" x="520" y="72" width="180" height="72" rx="6"/><text class="name" x="534" y="106">Deck publicado</text><text class="sub" x="534" y="124">JSON + versiones</text><rect class="n-back" x="760" y="72" width="160" height="72" rx="6"/><text class="name" x="774" y="99">Revisión</text><text class="sub" x="774" y="117">mismos hilos y</text><text class="sub" x="774" y="131">OK que un doc</text><rect class="n-store" x="280" y="272" width="180" height="72" rx="6"/><text class="name" x="294" y="299">Tema</text><text class="sub" x="294" y="317">claro + oscuro,</text><text class="sub" x="294" y="331">categorías, fuentes</text><rect class="n-focal" x="520" y="272" width="180" height="108" rx="6"/><text class="name" x="534" y="317">deck-render</text><text class="sub" x="534" y="335">valida y dibuja:</text><text class="sub" x="534" y="349">renderDeck(deck, tema)</text><rect class="n-ext" x="760" y="272" width="160" height="72" rx="6"/><text class="name" x="774" y="299">HTML</text><text class="sub" x="774" y="317">/p/&lt;id&gt;: teclas,</text><text class="sub" x="774" y="331">táctil, PDF</text><rect class="n-store" x="520" y="440" width="180" height="72" rx="6"/><text class="name" x="534" y="474">Archivos</text><text class="sub" x="534" y="492">imágenes assets/…</text><text class="note" x="40" y="404">Los temas de cada organización son datos en la base, no código.</text><text class="note" x="40" y="428">Un deck es una cuadrícula de hasta 4×4 con bloques (ver ESQUEMA.md).</text>
<line class="rule" x1="40" x2="920" y1="588" y2="588"/><rect class="n-ext" x="40" y="604" width="20" height="12" rx="3"/><text class="lbl" x="68" y="614">EXTERNO / CLIENTE</text><rect class="n-back" x="208.2" y="604" width="20" height="12" rx="3"/><text class="lbl" x="236.2" y="614">COMPONENTE</text><rect class="n-store" x="330.2" y="604" width="20" height="12" rx="3"/><text class="lbl" x="358.2" y="614">ALMACÉN (D1)</text><rect class="n-focal" x="465.4" y="604" width="20" height="12" rx="3"/><text class="lbl" x="493.4" y="614">FOCO</text></g>
</svg>